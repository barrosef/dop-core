<!doctype html>
<!-- dop-template: second_factor_code -->
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Código de verificação</title></head>
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c1e21">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;border:1px solid #e3e5e8">
    <tr><td style="padding:28px 32px 8px">
      <p style="margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b7280">DOP</p>
      <h1 style="margin:12px 0 0;font-size:22px;line-height:1.3">Seu código de verificação</h1>
    </td></tr>
    <tr><td style="padding:16px 32px 0">
      <p style="margin:0;font-size:34px;letter-spacing:.28em;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">{{.code}}</p>
      <p style="margin:12px 0 0;font-size:15px;line-height:1.6">Ele vale por {{.minutes}} minutos e só pode ser usado uma vez.</p>
    </td></tr>
    <tr><td style="padding:20px 32px 28px;font-size:12px;line-height:1.6;color:#6b7280;border-top:1px solid #eef0f2">
      <p style="margin:16px 0 0">Se não foi você quem pediu, ignore esta mensagem e troque sua senha — alguém tentou entrar com ela.</p>
      <p style="margin:8px 0 0">Ninguém do DOP vai pedir este código. Não o repasse.</p>
    </td></tr>
  </table>
</body>
</html>
