version: v2
modules:
  - path: .
lint:
  use: [STANDARD]
  except:
    # We return the entity directly (GetDemand → Demand) instead of wrapping it
    # in a <Method>Response. It is more ergonomic for the consumer and does not
    # block evolution: a new field goes into the entity itself.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - PACKAGE_VERSION_SUFFIX
breaking:
  use: [FILE]
