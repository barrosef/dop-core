syntax = "proto3";
package dop.v1;

import "dop/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Medição desde o primeiro dia; com BYO muda quem paga, não como se mede (ADR-0011).
message UsageEvent {
  string    id        = 1;
  DemandRef demand    = 2;
  string    thread_id = 3;
  string    model     = 4;
  int64     input_tokens  = 5;
  int64     output_tokens = 6;
  int64     cache_read_tokens     = 7;  // zerado em prefixo estável = ALERTA
  int64     cache_creation_tokens = 8;
  Money     cost      = 9;
  google.protobuf.Timestamp at = 10;
}

message Budget {
  string scope    = 1;   // account | demand
  string scope_id = 2;
  int64  limit_micros = 3;
  int64  spent_micros = 4;
  // A moeda viaja SEMPRE junto do valor. Micros sem moeda é número sem
  // unidade, e a borda estava tendo que inventar ou deixar em branco.
  string currency = 5;
}

// tarefa → (modelo, effort). Rascunho, calibra com telemetria (P-7).
message RoutingDecision {
  string task_kind = 1;   // mechanical | investigation | implementation | critic
  string model     = 2;
  string effort    = 3;
  string reason    = 4;
}

service CostService {
  rpc RecordUsage  (RecordUsageRequest)  returns (RecordUsageResponse);
  rpc GetBudget    (GetBudgetRequest)    returns (Budget);
  rpc SetBudget    (SetBudgetRequest)    returns (Budget);
  rpc RouteModel   (RouteModelRequest)   returns (RoutingDecision);
  rpc SummarizeCost(SummarizeCostRequest)returns (SummarizeCostResponse);
}

message RecordUsageRequest  { CallContext ctx = 1; UsageEvent usage = 2; string idempotency_key = 3; }
message RecordUsageResponse { bool recorded = 1; bool budget_exceeded = 2; }
message GetBudgetRequest    { CallContext ctx = 1; string scope = 2; string scope_id = 3; }
message SetBudgetRequest    { CallContext ctx = 1; Budget budget = 2; }
message RouteModelRequest   { CallContext ctx = 1; string task_kind = 2; string demand_id = 3; }
message SummarizeCostRequest  { CallContext ctx = 1; string scope = 2; string scope_id = 3; }
message SummarizeCostResponse {
  Money total = 1;
  double cache_hit_ratio = 2;
  repeated UsageEvent recent = 3;
}
