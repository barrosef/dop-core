syntax = "proto3";
package dop.v1;

import "dop/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Measurement from day one; with BYO what changes is who pays, not how it is
// measured (ADR-0008).
message UsageEvent {
  string    id        = 1;
  DemandRef demand    = 2;
  string    thread_id = 3;
  string    model     = 4;
  int64     input_tokens  = 5;
  int64     output_tokens = 6;
  int64     cache_read_tokens     = 7;  // zero on a stable prefix = AN ALERT
  int64     cache_creation_tokens = 8;
  Money     cost      = 9;
  google.protobuf.Timestamp at = 10;
}

message Budget {
  string scope    = 1;   // account | demand
  string scope_id = 2;
  int64  limit_micros = 3;
  int64  spent_micros = 4;
  // The currency ALWAYS travels with the value. Micros with no currency is a
  // number with no unit, and the edge was having to invent one or leave it
  // blank.
  string currency = 5;
}

// task → (model, effort). A draft, calibrated with telemetry (P-7).
message RoutingDecision {
  string task_kind = 1;   // mechanical | investigation | implementation | critic
  string model     = 2;
  string effort    = 3;
  string reason    = 4;
}

service CostService {
  rpc RecordUsage  (RecordUsageRequest)  returns (RecordUsageResponse);
  rpc GetBudget    (GetBudgetRequest)    returns (Budget);
  rpc SetBudget    (SetBudgetRequest)    returns (Budget);
  rpc RouteModel   (RouteModelRequest)   returns (RoutingDecision);
  rpc SummarizeCost(SummarizeCostRequest)returns (SummarizeCostResponse);
}

message RecordUsageRequest  { reserved 1; UsageEvent usage = 2; string idempotency_key = 3; }
message RecordUsageResponse { bool recorded = 1; bool budget_exceeded = 2; }
message GetBudgetRequest    { reserved 1; string scope = 2; string scope_id = 3; }
message SetBudgetRequest    { reserved 1; Budget budget = 2; }
message RouteModelRequest   { reserved 1; string task_kind = 2; string demand_id = 3; }
message SummarizeCostRequest  { reserved 1; string scope = 2; string scope_id = 3; }
message SummarizeCostResponse {
  Money total = 1;
  double cache_hit_ratio = 2;
  repeated UsageEvent recent = 3;
}
