syntax = "proto3";
package dop.v1;

import "dop/v1/common.proto";
import "dop/v1/demand.proto";
import "google/protobuf/struct.proto";

// The project's knowledge base in three layers (ADR-0006).
message KnowledgeArtifact {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_RULE        = 1;   // conventions the agent obeys
    KIND_INDEX       = 2;   // the code's map
    KIND_MEMORY      = 3;   // findings and lessons from past demands
  }
  string     id      = 1;
  ProjectRef project = 2;
  Kind       kind    = 3;
  string     name    = 4;
  int32      version = 5;
  string     object_ref = 6;   // the content in the ObjectStore
  google.protobuf.Struct meta = 7;
  AuditStamp audit   = 8;
}

// Luggage assembled per demand — it grows with the DEMAND, not with the project.
message ContextPackage {
  DemandRef demand = 1;
  repeated string rules = 2;
  repeated KnowledgeArtifact index    = 3;
  repeated KnowledgeArtifact memories = 4;
  repeated Finding findings = 5;
  int32  estimated_tokens = 6;   // measured by token counting at assembly time

  // How much was left OUT for budget, per layer. It is first-class information
  // (ADR-0008): without it the screen has no way to say "the context was
  // truncated", and pretends everything fitted — which is the most expensive way
  // of lying to whoever is deciding whether the agent has what it needs.
  map<string, int32> dropped = 7;
}

service KnowledgeService {
  rpc BuildContextPackage(BuildContextPackageRequest) returns (ContextPackage);
  rpc SearchMemory       (SearchMemoryRequest)        returns (SearchMemoryResponse);
  rpc ReadIndex          (ReadIndexRequest)           returns (KnowledgeArtifact);
  rpc PutArtifact        (PutArtifactRequest)         returns (KnowledgeArtifact);
  rpc ListRules          (ListRulesRequest)           returns (ListRulesResponse);
}

message BuildContextPackageRequest { reserved 1; string demand_id = 2; }
message SearchMemoryRequest  { reserved 1; ProjectRef project = 2; string query = 3; int32 limit = 4; }
message SearchMemoryResponse { repeated KnowledgeArtifact artifacts = 1; repeated float scores = 2; }
message ReadIndexRequest     { reserved 1; ProjectRef project = 2; string repo = 3; }
message PutArtifactRequest   { reserved 1; KnowledgeArtifact artifact = 2; bytes content = 3; string idempotency_key = 4; }
message ListRulesRequest     { reserved 1; ProjectRef project = 2; }
message ListRulesResponse    { repeated string rules = 1; }
