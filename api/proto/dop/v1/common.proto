syntax = "proto3";
package dop.v1;

import "google/protobuf/timestamp.proto";

// Typed references — a tenant is never an anonymous string (ADR-0017).
message AccountRef   { string id = 1; }
message WorkspaceRef { string id = 1; }
message ProjectRef   { string id = 1; }
message DemandRef    { string id = 1; }
message UserRef      { string id = 1; }
message ResourceRef  { string id = 1; }

// Who performed an action — a human, an agent or the system itself.
message ActorRef {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_USER        = 1;
    KIND_AGENT       = 2;
    KIND_SUBAGENT    = 3;
    KIND_SYSTEM      = 4;
  }
  Kind   kind = 1;
  string id   = 2;   // user_id, the agent's thread_id, or the component's name
  string name = 3;   // readable label
}

// CallContext DOES NOT EXIST — and the absence is deliberate.
//
// Every request used to declare `CallContext ctx = 1`, and the server ignored
// it: authorization reads the metadata (`x-actor-id`, `x-account-id`,
// `x-session-id`), never the body (ADR-0017, convention 5). A contract that
// declares a field with no effect teaches the wrong thing to whoever reads it —
// and the field was already being copied into every new proto.
//
// Number 1 is RESERVED in every request that carried it, so nobody reuses a tag
// an old client may still be sending on the wire.
//
// Who and in which account travel in the METADATA. If one day a field on the
// body is wanted, it will have to earn its own number and, above all, be read.

message PageRequest  { int32 size = 1; string token = 2; }
message PageResponse { string next_token = 1; int32 total = 2; }

message Money { string currency = 1; int64 amount_micros = 2; }

message AuditStamp {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  ActorRef                  created_by = 3;
}
