syntax = "proto3";
package dop.v1;

import "dop/v1/common.proto";

// The stage's semantic type: it decides the renderer on the screen and the
// agent's behaviour. The platform's vocabulary; composition is free (ADR-0014).
enum StageType {
  STAGE_TYPE_UNSPECIFIED     = 0;
  STAGE_TYPE_CONTEXT         = 1;
  STAGE_TYPE_SPEC            = 2;
  STAGE_TYPE_PLAN            = 3;
  STAGE_TYPE_IMPLEMENTATION  = 4;
  STAGE_TYPE_TEST            = 5;
  STAGE_TYPE_HUMAN_VALIDATION= 6;
  STAGE_TYPE_FINALIZATION    = 7;
  STAGE_TYPE_GENERIC         = 8;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_DOCUMENT    = 1;
  ARTIFACT_KIND_SPEC        = 2;
  ARTIFACT_KIND_PLAN        = 3;
  ARTIFACT_KIND_TEST_PLAN   = 4;
  ARTIFACT_KIND_DIAGRAM     = 5;
  ARTIFACT_KIND_REPORT      = 6;
}

enum Gate {
  GATE_UNSPECIFIED = 0;
  GATE_NONE        = 1;
  GATE_HUMAN       = 2;
}

message StageSpec {
  string       key       = 1;
  string       name      = 2;   // free, the author's
  StageType    type      = 3;
  repeated ArtifactKind artifacts = 4;
  Gate         gate      = 5;
  repeated string subtypes = 6;  // e.g.: test → aaa, e2e, integration
}

message Flow {
  string    id      = 1;
  string    name    = 2;
  string    description = 3;
  int32     version = 4;
  // The owning scope in the chain: platform | account | workspace | project | demand
  string    owner_scope = 5;
  string    owner_id    = 6;
  repeated StageSpec stages = 7;
  AuditStamp audit    = 8;
}

// The result of the chain platform ◁ account ◁ workspace ◁ project ◁ demand.
// StageOrigin says WHERE each stage came from in the resolution.
//
// Without it, nobody can debug why a demand followed a flow nobody remembers
// writing — and five-level inheritance makes that common, not exceptional.
message StageOrigin {
  string key   = 1;  // the stage's key, as it appears in Flow.stages
  string scope = 2;  // platform | account | workspace | project | demand
  string scope_id = 3;
}

message EffectiveFlow {
  Flow   flow          = 1;
  // A readable trail, for logs and error messages: "project ◂ workspace ◂ account".
  string resolved_from = 2;
  // The levels that CONTRIBUTED, from the most specific to the most general.
  repeated ScopeRef contributors = 3;
  // The provenance PER STAGE, in flow.stages' same order.
  //
  // It exists because `resolved_from` is a sentence, and the edge was having to
  // parse it to mark "inherited from the account" on the stage's line. A
  // contract that forces the consumer to interpret text is a contract that
  // breaks when somebody improves the wording.
  repeated StageOrigin origins = 4;
}

// ScopeRef addresses one level of the hierarchy. `id` is empty in the
// platform's catalog, which belongs to no account.
message ScopeRef {
  string scope = 1;
  string id    = 2;
}

service WorkflowService {
  rpc ListFlows     (ListFlowsRequest)     returns (ListFlowsResponse);
  rpc GetFlow       (GetFlowRequest)       returns (Flow);
  rpc CreateFlow    (CreateFlowRequest)    returns (Flow);
  rpc UpdateFlow    (UpdateFlowRequest)    returns (Flow);   // generates a new version
  rpc ValidateFlow  (ValidateFlowRequest)  returns (ValidateFlowResponse);
  rpc ResolveFlow   (ResolveFlowRequest)   returns (EffectiveFlow);
  rpc PromoteFlow   (PromoteFlowRequest)   returns (Flow);
}

message ListFlowsRequest  { CallContext ctx = 1; string owner_scope = 2; string owner_id = 3; }
message ListFlowsResponse { repeated Flow flows = 1; }
message GetFlowRequest    { CallContext ctx = 1; string id = 2; }
message CreateFlowRequest { CallContext ctx = 1; Flow flow = 2; string idempotency_key = 3; }
message UpdateFlowRequest { CallContext ctx = 1; Flow flow = 2; }
message ValidateFlowRequest  { CallContext ctx = 1; Flow flow = 2; }
message ValidateFlowResponse {
  bool valid = 1;
  repeated string errors   = 2;
  repeated string warnings = 3;  // e.g.: a flow with no spec stage
}
message ResolveFlowRequest { CallContext ctx = 1; string scope = 2; string scope_id = 3; }
message PromoteFlowRequest { CallContext ctx = 1; string flow_id = 2; string target_scope = 3; string target_id = 4; }
