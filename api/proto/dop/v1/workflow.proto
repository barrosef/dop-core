syntax = "proto3";
package dop.v1;

import "dop/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// The stage's semantic type: it decides the renderer on the screen and the
// agent's behaviour. The platform's vocabulary; composition is free (ADR-0014).
enum StageType {
  STAGE_TYPE_UNSPECIFIED     = 0;
  STAGE_TYPE_CONTEXT         = 1;
  STAGE_TYPE_SPEC            = 2;
  STAGE_TYPE_PLAN            = 3;
  STAGE_TYPE_IMPLEMENTATION  = 4;
  STAGE_TYPE_TEST            = 5;
  STAGE_TYPE_HUMAN_VALIDATION= 6;
  STAGE_TYPE_FINALIZATION    = 7;
  STAGE_TYPE_GENERIC         = 8;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_DOCUMENT    = 1;
  ARTIFACT_KIND_SPEC        = 2;
  ARTIFACT_KIND_PLAN        = 3;
  ARTIFACT_KIND_TEST_PLAN   = 4;
  ARTIFACT_KIND_DIAGRAM     = 5;
  ARTIFACT_KIND_REPORT      = 6;
}

enum Gate {
  GATE_UNSPECIFIED = 0;
  GATE_NONE        = 1;
  GATE_HUMAN       = 2;
}

message StageSpec {
  string       key       = 1;
  string       name      = 2;   // free, the author's
  StageType    type      = 3;
  repeated ArtifactKind artifacts = 4;
  Gate         gate      = 5;
  repeated string subtypes = 6;  // e.g.: test → aaa, e2e, integration
}

message Flow {
  string    id      = 1;
  string    name    = 2;
  string    description = 3;
  int32     version = 4;
  // The owning scope in the chain: platform | account | workspace | project | demand
  string    owner_scope = 5;
  string    owner_id    = 6;
  repeated StageSpec stages = 7;
  AuditStamp audit    = 8;
}

// The result of the chain platform ◁ account ◁ workspace ◁ project ◁ demand.
// StageOrigin says WHERE each stage came from in the resolution.
//
// Without it, nobody can debug why a demand followed a flow nobody remembers
// writing — and five-level inheritance makes that common, not exceptional.
message StageOrigin {
  string key   = 1;  // the stage's key, as it appears in Flow.stages
  string scope = 2;  // platform | account | workspace | project | demand
  string scope_id = 3;
}

message EffectiveFlow {
  Flow   flow          = 1;
  // A readable trail, for logs and error messages: "project ◂ workspace ◂ account".
  string resolved_from = 2;
  // The levels that CONTRIBUTED, from the most specific to the most general.
  repeated ScopeRef contributors = 3;
  // The provenance PER STAGE, in flow.stages' same order.
  //
  // It exists because `resolved_from` is a sentence, and the edge was having to
  // parse it to mark "inherited from the account" on the stage's line. A
  // contract that forces the consumer to interpret text is a contract that
  // breaks when somebody improves the wording.
  repeated StageOrigin origins = 4;
}

// ScopeRef addresses one level of the hierarchy. `id` is empty in the
// platform's catalog, which belongs to no account.
message ScopeRef {
  string scope = 1;
  string id    = 2;
}

service WorkflowService {
  rpc ListFlows     (ListFlowsRequest)     returns (ListFlowsResponse);
  rpc GetFlow       (GetFlowRequest)       returns (Flow);
  rpc CreateFlow    (CreateFlowRequest)    returns (Flow);
  rpc UpdateFlow    (UpdateFlowRequest)    returns (Flow);   // generates a new version
  rpc ValidateFlow  (ValidateFlowRequest)  returns (ValidateFlowResponse);
  rpc ResolveFlow   (ResolveFlowRequest)   returns (EffectiveFlow);
  rpc PromoteFlow   (PromoteFlowRequest)   returns (Flow);

  // ── sharing: publish, grant, derive, pin (flow sharing spec) ──────────────
  //
  // Nothing here is live — every RPC below is request/response, never a
  // stream, matching ADR-0017 convention 1: server-side streaming is reserved
  // for what actually changes while the client is looking at it.
  rpc PublishFlow       (PublishFlowRequest)       returns (FlowPublication);
  rpc WithdrawFlow      (WithdrawFlowRequest)      returns (google.protobuf.Empty);
  rpc GrantFlow         (GrantFlowRequest)         returns (FlowGrant);
  rpc RevokeFlowGrant   (RevokeFlowGrantRequest)   returns (google.protobuf.Empty);
  rpc DeriveFlow        (DeriveFlowRequest)        returns (Flow);
  rpc BumpFlowPin       (BumpFlowPinRequest)       returns (google.protobuf.Empty);
  rpc ListFlowShares    (ListFlowSharesRequest)    returns (ListFlowSharesResponse);
  rpc ListFlowAdoptions (ListFlowAdoptionsRequest) returns (ListFlowAdoptionsResponse);
}

message ListFlowsRequest  { reserved 1; string owner_scope = 2; string owner_id = 3; }
message ListFlowsResponse { repeated Flow flows = 1; }
message GetFlowRequest    { reserved 1; string id = 2; }
message CreateFlowRequest { reserved 1; Flow flow = 2; string idempotency_key = 3; }
message UpdateFlowRequest { reserved 1; Flow flow = 2; }
message ValidateFlowRequest  { reserved 1; Flow flow = 2; }
message ValidateFlowResponse {
  bool valid = 1;
  repeated string errors   = 2;
  repeated string warnings = 3;  // e.g.: a flow with no spec stage
}
message ResolveFlowRequest { reserved 1; string scope = 2; string scope_id = 3; }
message PromoteFlowRequest { reserved 1; string flow_id = 2; string target_scope = 3; string target_id = 4; }

// ── sharing (flow sharing spec) ─────────────────────────────────────────────
//
// These messages are new — there was never a `CallContext ctx = 1` on any of
// them, so none reserves field 1 (ADR-0017 convention 5).
//
// WithdrawFlowRequest, RevokeFlowGrantRequest and BumpFlowPinRequest carry no
// idempotency_key: the Service methods behind them (Withdraw, Revoke, BumpPin)
// take none — each is naturally idempotent by construction (a withdrawal that
// finds the row already withdrawn, a revocation that finds the share already
// revoked, a pin write that is itself an upsert), so there is nowhere for the
// key to go. Declaring one here anyway is exactly the field-with-no-effect
// ADR-0017 §5 already paid down once for CallContext.

message PublishFlowRequest {
  string flow_id = 1;
  string slug    = 2;   // completes @handle/slug
  string notes   = 3;
  string idempotency_key = 4;
}

// FlowPublication is one version of a flow made addressable outside the
// account. `reference` is rendered by the SERVER from the publisher's handle,
// the slug and the version: three clients assembling "@handle/slug@vN"
// themselves is three places for the format to drift.
message FlowPublication {
  string id = 1;
  string flow_id = 2;
  string reference = 3;  // "@acme/backend-go@v3"
  int32  version = 4;
  string notes = 5;
  google.protobuf.Timestamp published_at = 6;
  google.protobuf.Timestamp withdrawn_at = 7;
}

message WithdrawFlowRequest { string publication_id = 1; }

// `to_account` is an AccountRef, not a bare string (ADR-0017 convention 2: a
// tenant is never an anonymous string) — the same shape `resource.proto`,
// `identity.proto`, `event.proto`, `attention.proto` and `hierarchy.proto`
// already use for every account reference in the contract. `workflow.proto`
// had no account-shaped field before this file, so the precedent to follow
// lives in those sibling files, not in this one.
message GrantFlowRequest {
  string publication_id  = 1;
  dop.v1.AccountRef to_account = 2;
  string idempotency_key = 3;
}

// FlowGrant is permission for ONE account to derive from a publication, with
// the revocation policy stamped at the moment it was granted — reading the
// publisher's CURRENT default at revocation time would let the terms change
// after somebody already accepted them.
message FlowGrant {
  string id                    = 1;
  string publication_id        = 2;
  dop.v1.AccountRef to_account = 3;
  string revocation_policy     = 4; // prospective | drain | terminate
  google.protobuf.Timestamp granted_at = 5;
  google.protobuf.Timestamp revoked_at = 6;
}

message RevokeFlowGrantRequest { string share_id = 1; }

message DeriveFlowRequest {
  string reference = 1;             // "@acme/backend-go" or pinned
  dop.v1.ScopeRef target = 2;       // where to install the copy
  string idempotency_key = 3;
}

message BumpFlowPinRequest {
  string flow_id = 1;
  int32  version = 2;
}

message ListFlowSharesRequest  { string publication_id = 1; }
message ListFlowSharesResponse { repeated FlowGrant shares = 1; }

// FlowAdoption is the PUBLISHER's own record that another account derived a
// copy — the outbound half of the provenance the copy itself carries
// (see Flow's origin, task 9).
message FlowAdoption {
  string id             = 1;
  string publication_id = 2;
  int32  version        = 3;
  dop.v1.AccountRef by_account = 4;
  string flow_id        = 5; // the copy, in the OTHER account
  google.protobuf.Timestamp derived_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

message ListFlowAdoptionsRequest  { string publication_id = 1; }
message ListFlowAdoptionsResponse { repeated FlowAdoption adoptions = 1; }
