syntax = "proto3";
package dop.v1;

import "dop/v1/common.proto";
import "google/protobuf/struct.proto";

// A resource is the account's unit of ownership and sharing (ADR-0009).
message Resource {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_INTEGRATION = 1;
    KIND_SKILL       = 2;
    KIND_WORKFLOW    = 3;
    KIND_GIT_FLOW    = 4;
  }
  string     id      = 1;
  AccountRef account = 2;
  Kind       kind    = 3;
  string     name    = 4;
  int32      version = 5;
  google.protobuf.Struct config = 6;
  // An opaque pointer into the SecretStore — NEVER the secret (ADR-0001).
  string     credential_ref = 7;
  AuditStamp audit   = 8;
}

// The integrations' detail (the only kind with a credential).
message IntegrationSpec {
  enum Category {
    CATEGORY_UNSPECIFIED = 0;
    CATEGORY_GIT          = 1;
    CATEGORY_TASK_MANAGER = 2;
    CATEGORY_AGENT        = 3;
  }
  enum AuthMethod {
    AUTH_METHOD_UNSPECIFIED = 0;
    AUTH_METHOD_OAUTH_APP   = 1;   // an organization credential — preferred for companies
    AUTH_METHOD_OAUTH_USER  = 2;
    AUTH_METHOD_TOKEN       = 3;
    AUTH_METHOD_SSH_KEY     = 4;
  }
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE      = 1;
    STATUS_EXPIRED     = 2;
    STATUS_REVOKED     = 3;
    STATUS_ERROR       = 4;
  }
  Category   category = 1;
  string     provider = 2;   // github, gitlab, azure_devops, jira, claude, ...
  string     base_url = 3;   // self-hosted
  AuthMethod auth_method = 4;
  Status     status   = 5;
  UserRef    connected_by = 6;
}

message ResourceGrant {
  string      id       = 1;
  ResourceRef resource = 2;
  UserRef     user     = 3;
  string      level    = 4;  // use | manage
}

service ResourceService {
  rpc ListResources  (ListResourcesRequest)  returns (ListResourcesResponse);
  rpc GetResource    (GetResourceRequest)    returns (Resource);
  rpc CreateResource (CreateResourceRequest) returns (Resource);
  rpc UpdateResource (UpdateResourceRequest) returns (Resource);
  rpc DeleteResource (DeleteResourceRequest) returns (DeleteResourceResponse);
  rpc GrantResource  (GrantResourceRequest)  returns (ResourceGrant);
  rpc RevokeGrant    (RevokeGrantRequest)    returns (RevokeGrantResponse);
  // The grants of ONE person in the active account — what the members screen
  // needs in order to show state before editing it.
  rpc ListMemberGrants(ListMemberGrantsRequest) returns (ListMemberGrantsResponse);
  // The credential is written to the SecretStore; the value never comes back on a read.
  rpc SetCredential  (SetCredentialRequest)  returns (SetCredentialResponse);
}

message ListResourcesRequest  { reserved 1; Resource.Kind kind = 2; PageRequest page = 3; }
message ListResourcesResponse { repeated Resource resources = 1; PageResponse page = 2; }
message GetResourceRequest    { reserved 1; string id = 2; }
message CreateResourceRequest {
  reserved 1;
  Resource.Kind kind = 2;
  string name = 3;
  google.protobuf.Struct config = 4;
  string idempotency_key = 5;
}
message UpdateResourceRequest { reserved 1; string id = 2; google.protobuf.Struct config = 3; }
message DeleteResourceRequest { reserved 1; string id = 2; }
message DeleteResourceResponse{ bool deleted = 1; }
message GrantResourceRequest  { reserved 1; string resource_id = 2; string user_id = 3; string level = 4; }
message RevokeGrantRequest    { reserved 1; string grant_id = 2; }
message RevokeGrantResponse   { bool revoked = 1; }
message ListMemberGrantsRequest  { reserved 1; string user_id = 2; }
message ListMemberGrantsResponse { repeated ResourceGrant grants = 1; }
message SetCredentialRequest  { reserved 1; string resource_id = 2; bytes secret = 3; }
message SetCredentialResponse { string credential_ref = 1; }
