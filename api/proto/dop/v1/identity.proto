syntax = "proto3";
package dop.v1;

import "dop/v1/common.proto";
import "google/protobuf/timestamp.proto";

message User {
  string   id             = 1;
  string   email          = 2;
  string   name           = 3;
  string   avatar_url     = 4;
  repeated string providers = 5;  // password, google.com, github.com, linkedin.com
  AuditStamp audit        = 6;
}

message Account {
  enum Kind {
    KIND_UNSPECIFIED  = 0;
    KIND_PERSONAL     = 1;
    KIND_ORGANIZATION = 2;
  }
  string id           = 1;
  Kind   kind         = 2;
  string handle       = 3;   // unique on the platform; personal and organization accounts share the namespace
  string display_name = 4;
  // Organization
  string legal_id        = 10;  // the company's registration number
  string legal_name      = 11;
  string verified_domain = 12;  // empty = not verified
  AuditStamp audit       = 20;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER       = 1;
  ROLE_ADMIN       = 2;
  ROLE_DEVELOPER   = 3;
  ROLE_VIEWER      = 4;
}

message Membership {
  string     id       = 1;
  UserRef    user     = 2;
  AccountRef account  = 3;
  Role       role     = 4;
  AuditStamp audit    = 5;
}

message Invite {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING     = 1;
    STATUS_ACCEPTED    = 2;
    STATUS_EXPIRED     = 3;
    STATUS_REVOKED     = 4;
  }
  string     id         = 1;
  AccountRef account    = 2;
  string     email      = 3;
  Role       role       = 4;
  // Grants composed IN THE INVITE — with no defaults (ADR-0013)
  repeated ResourceGrantSpec grants = 5;
  Status     status     = 6;
  google.protobuf.Timestamp expires_at = 7;
  AuditStamp audit      = 8;
}

message ResourceGrantSpec {
  ResourceRef resource = 1;
  string      level    = 2;  // use | manage
}

// ── service ─────────────────────────────────────────────────────
service IdentityService {
  rpc GetUser        (GetUserRequest)        returns (User);
  rpc EnsureUser     (EnsureUserRequest)     returns (User);        // idempotent: the first login
  rpc ListAccounts   (ListAccountsRequest)   returns (ListAccountsResponse);
  rpc GetAccount     (GetAccountRequest)     returns (Account);
  rpc CreateAccount  (CreateAccountRequest)  returns (Account);
  rpc ListMemberships(ListMembershipsRequest)returns (ListMembershipsResponse);
  // SendEmailVerification sends the message that proves a password credential's
  // address (spec SP-0 US-2). The LINK IS GENERATED BY THE CALLER: the BFF holds
  // the Firebase Admin capability and the core does not.
  //
  // Read it as what it would be if it were open — an endpoint that mails
  // arbitrary text to an arbitrary address is a relay. It is not open: only a
  // caller the core verified reaches it (ADR-0029), and the per-address ceiling
  // is the second line for the day the first one has a hole.
  rpc SendEmailVerification(SendEmailVerificationRequest) returns (SendEmailVerificationResponse);
  rpc CreateInvite   (CreateInviteRequest)   returns (Invite);
  rpc AcceptInvite   (AcceptInviteRequest)   returns (Membership);
  rpc RevokeInvite   (RevokeInviteRequest)   returns (Invite);
  rpc UpdateMembership(UpdateMembershipRequest) returns (Membership);
  // Taking somebody out of the account. It sweeps the grants they held HERE;
  // their user, their personal account and what they created stay (US-5.3).
  rpc RemoveMembership(RemoveMembershipRequest) returns (RemoveMembershipResponse);
  rpc ListInvites    (ListInvitesRequest)    returns (ListInvitesResponse);
  // GetInvite is the ONE identity RPC that does not require an active account:
  // whoever opens the link may not be a member of anything yet — that is the
  // point of an invite. It requires a session all the same.
  rpc GetInvite      (GetInviteRequest)      returns (InvitePreview);
}

message ListInvitesRequest  { reserved 1; }
message ListInvitesResponse { repeated Invite invites = 1; }

message GetInviteRequest { reserved 1; string id = 2; }

// What whoever OPENS the link sees. It does NOT carry the invitee's e-mail:
// whoever finds the link must not learn an address from it (ADR-0026).
message InvitePreview {
  string id           = 1;
  string account_name = 2;
  Role   role         = 3;
  Invite.Status status = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool usable = 6;
}

message GetUserRequest    { reserved 1; string id = 2; }
message EnsureUserRequest {
  // A normalized Principal coming from the IdentityProvider — Firebase claims
  // do not cross this frontier (ADR-0001).
  string subject        = 1;
  string email          = 2;
  bool   email_verified = 3;
  string name           = 4;
  string avatar_url     = 5;
  string provider       = 6;
  string idempotency_key = 7;
}
message ListAccountsRequest  { reserved 1; UserRef user = 2; }
// The account as ONE PERSON sees it.
//
// The role is not a property of the account — the same account is owned by one
// person and merely viewed by another. Putting it on `Account` would be a
// category error, and worse: a field relative to the observer, sitting inside a
// shared entity that gets cached and passed around.
message AccountMembership {
  Account account = 1;
  Role    role    = 2;
}

message ListAccountsResponse {
  // Deprecated: carries no role, so a caller cannot tell an owner from a
  // viewer. Still filled during the transition; `items` replaces it.
  repeated Account accounts = 1 [deprecated = true];
  repeated AccountMembership items = 2;
}
message GetAccountRequest    { reserved 1; string id = 2; }
message CreateAccountRequest {
  reserved 1;
  Account.Kind kind = 2;
  string handle       = 3;
  string display_name = 4;
  string legal_id     = 5;
  string idempotency_key = 6;
}
message SendEmailVerificationRequest {
  string email = 1;
  // Subject is the Firebase credential's subject. It is stored beside the
  // address for forensics and never used as the rate limit's key: at this point
  // the core has no user, and two credentials on one address is the shape of
  // somebody probing rather than of a person signing up.
  string subject = 2;
  // Link is the ready-to-follow verification URL, generated by the caller.
  string link = 3;
  string display_name = 4;
}
message SendEmailVerificationResponse {}

message ListMembershipsRequest  { reserved 1; AccountRef account = 2; }
message ListMembershipsResponse { repeated Membership memberships = 1; }
message CreateInviteRequest {
  reserved 1;
  string      email = 2;
  Role        role  = 3;
  repeated ResourceGrantSpec grants = 4;
  string idempotency_key = 5;
}
// Acceptance addresses the invite by its id — NOT by a secret. The id alone
// grants nothing: the server requires the session's verified email to be the
// invite's. An old client sending the token here simply does not find the row,
// which is the correct failure.
message AcceptInviteRequest { reserved 1; string invite_id = 2; string idempotency_key = 3; }
message RevokeInviteRequest { reserved 1; string id = 2; }
message RemoveMembershipRequest  { reserved 1; string membership_id = 2; }
message RemoveMembershipResponse { bool removed = 1; }

message UpdateMembershipRequest {
  reserved 1;
  string membership_id = 2;
  Role   role = 3;
  repeated ResourceGrantSpec grants = 4;
}
